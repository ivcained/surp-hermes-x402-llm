[project]
name = "surp-hermes-x402-llm"
version = "0.8.1"
description = "Jev-integrated smart LLM routing tools for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ivcained"}]
keywords = ["hermes-agent", "x402", "llm", "usdc", "surp", "jev", "typesafe", "decision-model", "smart-routing"]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://surp.ivc.lol"
Repository = "https://github.com/ivcained/surp-hermes-x402-llm"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
