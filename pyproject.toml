[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "surp-hermes-x402-llm"
version = "0.2.1"
description = "Cache-aware Surp LLM routing tools for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ivcained"}]
keywords = ["hermes-agent", "x402", "llm", "usdc", "surp"]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://surp.ivc.lol"
Repository = "https://github.com/ivcained/surp-hermes-x402-llm"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["client", "handlers", "schemas"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
