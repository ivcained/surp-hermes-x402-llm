<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURP marketplace — harness</title>
<style>
  :root {
    --ui-bg-base: #16161a; --ui-bg-elevated: #1e1e24; --ui-bg-overlay: #26262e;
    --ui-text-primary: #f2f1ec; --ui-text-secondary: #b7b5b0; --ui-text-tertiary: #8a8884;
    --ui-stroke-secondary: #35353c; --ui-accent: #d4ff3f; --foreground: #f2f1ec;
    --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--ui-bg-base); font-family: var(--font-sans); color: var(--ui-text-primary); }
  #root { min-height: 100vh; }
  #harness-bar { position: sticky; top: 0; z-index: 10; padding: 8px 16px; font-size: 12px; color: var(--ui-text-tertiary); background: var(--ui-bg-elevated); border-bottom: 1px solid var(--ui-stroke-secondary); }
  #harness-log { white-space: pre-wrap; font-size: 11px; color: var(--ui-text-tertiary); padding: 8px 16px; max-height: 120px; overflow: auto; border-top: 1px solid var(--ui-stroke-secondary); }
</style>
</head>
<body>
<div id="harness-bar">SURP harness — real desktop/plugin.js + live backend. Tabs, order book, switches and default route below are the review surface.</div>
<div id="root"></div>
<div id="harness-log"></div>
<script type="importmap">
{ "imports": {
  "react": "/shim/react.js",
  "react/jsx-runtime": "/shim/jsx.js",
  "react-dom/client": "/shim/react-dom.js",
  "@hermes/plugin-sdk": "/shim/sdk.js"
} }
</script>
<script type="module">
import React from 'react';
import ReactDOM from 'react-dom/client';
import page from '/surp-page/plugin.js';

const log = document.getElementById('harness-log');
const say = s => { log.textContent += s + '\n'; };
window.addEventListener('error', e => say('PAGE ERROR: ' + (e.message || e.error)));
window.addEventListener('unhandledrejection', e => say('REJECTION: ' + (e.reason && e.reason.message || e.reason)));

// registrations: fake ctx records them; run every render in registration order
const entries = [];
const ctx = {
  i18n: { register() {} },
  storage: { _m: new Map(), get(k, d) { return this._m.has(k) ? this._m.get(k) : d; }, set(k, v) { this._m.set(k, v); } },
  rest: async (path, options) => {
    const r = await fetch('/surp-api' + path, { method: (options && options.method) || 'GET', headers: { 'Content-Type': 'application/json' }, body: options && options.body ? JSON.stringify(options.body) : undefined });
    const j = await r.json();
    if (!r.ok || j.ok === false) console.log('[harness] api note', path, j.error || r.status);
    return j;
  },
  register(e) { entries.push(e); },
  registerMany(es) { es.forEach(e => entries.push(e)); },
};

page.register(ctx);
const root = document.getElementById('root');
ReactDOM.createRoot(root).render(null);
// render each render-capable registration as its own section
import { createElement as h } from '/shim/react.js';
const mounts = entries.filter(e => typeof e.render === 'function');
say('registered entries: ' + entries.map(e => e.id + ':' + e.area).join(', '));
say('renderable mounts: ' + mounts.length);
function App() {
  return React.createElement('div', { id: 'surp-harness-app' }, mounts.map((e, i) =>
    React.createElement('section', { key: e.id || i, 'data-entry': e.id },
      React.createElement(e.render, { ctx }))));
}
try {
  ReactDOM.createRoot(root).render(React.createElement(App));
  say('App rendered');
} catch (err) {
  say('RENDER ERROR: ' + (err && err.stack || err));
  root.textContent = 'render failed: ' + (err && err.message);
}
</script>
</body>
</html>
