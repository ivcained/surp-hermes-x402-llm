name: surp-hermes-x402-llm
version: 0.3.0
manifest_version: 2
api_version: 1
description: "Jev-integrated smart LLM routing for Hermes — live models, quotes, cache status, guarded paid chat, usage, and decision-model route selection via TypeSafe Jev."
author: ivcained
license: MIT
homepage: https://github.com/ivcained/surp-hermes-x402-llm
tags: ["llm", "x402", "usdc", "base", "routing", "cache", "jev", "typesafe", "decision-model", "smart-routing"]
kind: backend
requires_env:
  - name: SURP_API_KEY
    description: "A Surp API key for paid chat and usage. Public discovery and cache tools work without it."
    url: "https://surp.ivc.lol/app"
    secret: true
config_schema:
  base_url:
    type: str
    default: "https://surp.ivc.lol"
    description: "Surp gateway base URL"
  max_spend_usd:
    type: float
    default: 0.05
    description: "Maximum amount a single paid tool call may authorize"
  timeout_seconds:
    type: int
    default: 30
    description: "HTTP timeout"
provides_tools:
  - surp_models
  - surp_quote
  - surp_cache_status
  - surp_chat
  - surp_usage
  - surp_combo_create
  - surp_combo_list
  - surp_combo_get
provides_skills:
  - surp
